[workspace]
members = ["core"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/Droplet-Collective/VRCInviteTool"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["sync", "time", "macros", "rt-multi-thread"] }
tracing = "0.1"

# Tauri アプリ本体。VRChat クライアント・セッション保存は `core` クレートに分離している
# (Tauri 非依存なので Linux CI でも `cargo test` できる)。
[package]
name = "vrcinvitetool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "VRChat のインスタンス作成・フレンド招待ツール"
authors = ["Droplet-Collective"]

[lib]
name = "vrcinvitetool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
vrcinvite-core = { path = "core" }
tauri = { version = "2.12", features = [] }
tauri-plugin-clipboard-manager = "2.4"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["fmt", "std", "time", "env-filter"] }
tracing-appender = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
