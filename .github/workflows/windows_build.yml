name: Build Windows App

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]  # "v"で始まるタグ（v1.0.0など）がプッシュされた時にトリガー
  workflow_dispatch:

# 既定は読み取りのみ。Release 作成を行う build ジョブだけに contents: write を付与する
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    # GitHub Tokenの権限設定（Release作成に必要）
    permissions:
      contents: write

    steps:
    # 1. コードのチェックアウト
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

    # 2. Pythonのセットアップ
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: '3.12'

    # 3. 依存関係のインストール
    - name: Install dependencies
      shell: pwsh
      run: |
        pip install -r requirements.txt
        pip install pyinstaller

    # 4. PyInstaller でビルド
    - name: Build Windows App
      env:
        PYTHONUTF8: "1"
      shell: pwsh
      run: pyinstaller --name VRCInviteTool --onefile --windowed --collect-all flet --collect-all flet_desktop main.py

    # 5. 成果物をArtifactsにアップロード 
    - name: Upload Artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      with:
        name: VRCInviteTool
        path: dist/VRCInviteTool.exe

    # 6. ZIP化
    - name: Zip artifact
      shell: pwsh
      run: Compress-Archive -Path dist/VRCInviteTool.exe -DestinationPath dist/VRCInviteTool.zip

    # 7. Releaseを作成してファイルを添付
    - name: Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/VRCInviteTool.zip
        draft: true
        prerelease: false
