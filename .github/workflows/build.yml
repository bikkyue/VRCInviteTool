name: Build

on:
  push:
    branches: ["main", "rewrite/rust-tauri"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# 既定は読み取りのみ。Release を作る release ジョブだけに contents: write を付与する
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Lint / Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1 (stable)
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # tsc --noEmit + vite build。dist/ は tauri::generate_context! がコンパイル時に埋め込むため先に作る
      - name: Build frontend
        run: npm run build

      - name: cargo fmt
        run: cargo fmt --all --check
        working-directory: src-tauri

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: src-tauri

      - name: cargo test
        run: cargo test --workspace --locked
        working-directory: src-tauri

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1 (stable)
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # 単体 .exe (src-tauri/target/release/VRCInviteTool.exe) と NSIS インストーラをビルドする。
      # tagName 等を渡していないので Release は作らない (release ジョブで行う)。
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1ddc7b49b13c3038297360482fcb3e058764d7c9 # v0.6.2
        with:
          includeUpdaterJson: false

      - name: Upload portable exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VRCInviteTool-windows-x64
          path: src-tauri/target/release/VRCInviteTool.exe
          if-no-files-found: error

      - name: Upload NSIS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VRCInviteTool-windows-x64-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Draft Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Zip portable exe
        run: |
          cd artifacts
          ls -la
          zip -j VRCInviteTool-${{ github.ref_name }}-windows-x64.zip VRCInviteTool.exe

      - name: Create draft release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          draft: true
          prerelease: false
          files: |
            artifacts/VRCInviteTool-${{ github.ref_name }}-windows-x64.zip
            artifacts/*-setup.exe
